<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Halloween Tic Tac Toe</title>
    <link rel="icon" type="image/svg" href="halloween-josy-dom-alexis/svg/Burning-Candles.svg">
</head>
<body>
    <div class="container">
        <div class="header-items">
            <h1 class="title"> <p class="halloween"> Halloween</p>
                <span class="title-dark"> Tic </span>
                <span class="title-light"> Tac </span>
                <span class="title-dark"> Toe </span>
            </h1>
            <button id="restartBtn">Restart</button>
        </div>
        <div class="game-wrapper">
            <div class="game-grid">
                <div class="grid-box" id="0"></div>
                <div class="grid-box" id="1"></div>
                <div class="grid-box" id="2"></div>
                <div class="grid-box" id="3"></div>
                <div class="grid-box" id="4"></div>
                <div class="grid-box" id="5"></div>
                <div class="grid-box" id="6"></div>
                <div class="grid-box" id="7"></div>
                <div class="grid-box" id="8"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
